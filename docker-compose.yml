services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: revenue_recovery_db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-revenue_recovery}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-revenue_recovery}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - revenue_recovery_net

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service (Agent Host + Policy Engine + Executor)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revenue_recovery_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-revenue_recovery}
      CHROMA_PERSIST_DIR: /app/data/chroma_db
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/data/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - revenue_recovery_net

  # ----------------------------------------------------------------------------
  # React + TypeScript + Vite Frontend UI
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: revenue_recovery_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - revenue_recovery_net

networks:
  revenue_recovery_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  chroma_data:
    driver: local
